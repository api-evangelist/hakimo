aid: hakimo
name: Hakimo
description: >-
  Hakimo is a Menlo Park, California physical-security software company founded by Stanford AI
  researchers Sam Joseph and Sagar Honnungar. Its AI platform sits on top of a customer's existing
  camera, NVR/VMS and access-control estate and turns it into an autonomous security operations
  capability: the AI Operator triages alarms and assigns a true-alarm probability, remote guarding
  and SOC-as-a-Service provide 24/7 monitored response, and forensic search, weapon detection,
  facial recognition, an insights dashboard and a mobile app round out the product line. Hakimo
  integrates with roughly forty third-party systems (Genetec, Milestone, Avigilon, LenelS2, Eagle
  Eye Networks, Axis, ServiceNow, Slack, Microsoft Teams, ONVIF devices) by consuming those
  vendors' APIs. As of August 2026 Hakimo publishes no public developer program of its own: there
  is no developer portal, no API reference, no OpenAPI or other machine-readable contract, and no
  SDK. Its tenant application API is served same-origin from the customer portal and answers
  unauthenticated requests with HTTP 401.
